name: OWASP ZAP Security Scan

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Run DAST Scan
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start Application via Docker Compose
        run: |
          docker compose up -d
          echo "Warte 45 Sekunden, bis Spring Boot komplett hochgefahren ist..."
          sleep 45 

      - name: Debug - Show Docker Status
        # Dieser Schritt zeigt uns an, ob der Container noch läuft oder gecrasht ist
        run: |
          docker ps
          docker compose logs

      - name: Fix Workspace Permissions for ZAP

        run: chmod -R 777 $GITHUB_WORKSPACE

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080'
          fail_action: false

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZAP-Security-Report
          path: zap_report.html