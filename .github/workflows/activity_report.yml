name: Weekly_Activity_Report
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Kalenderwoche ermitteln
        id: kw
        run: echo "value=$(date +%V)" >> $GITHUB_OUTPUT

      - name: Issue erstellen
        run: |
          gh issue create \
            --title "📊 Weekly Activity Report — KW ${{ steps.kw.outputs.value }} [Backend]" \
            --body "Weekly Activity Report — automatisch generiert." \
            --label "report,weekly,planning"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}